name: Build Aurora JTTY Windows
on:
  workflow_dispatch:
    inputs:
      windows_runner:
        description: Windows runner (alternate when a pool is queued)
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-2025
permissions:
  contents: read
jobs:
  windows:
    runs-on: ${{ inputs.windows_runner || 'windows-2022' }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Preserve source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar autoconf automake libtool
            mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python mingw-w64-x86_64-boost
            mingw-w64-x86_64-qt5-base mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-tools mingw-w64-x86_64-qt5-websockets
            mingw-w64-x86_64-qt5-activeqt mingw-w64-x86_64-fftw
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-pkg-config mingw-w64-x86_64-nsis
      - name: Install pinned libusb package
        # This signed package remains on the official mirror but is no longer
        # listed in the rolling MINGW64 repository database.
        run: |
          mkdir -p build/pinned-packages
          package=mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst
          base=https://mirror.msys2.org/mingw/mingw64
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 --output "build/pinned-packages/$package" "$base/$package"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 --output "build/pinned-packages/$package.sig" "$base/$package.sig"
          pacman-key --verify "build/pinned-packages/$package.sig" "build/pinned-packages/$package"
          pacman --noconfirm -U "build/pinned-packages/$package"
      - name: Cache Hamlib build
        id: hamlib-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/hamlib-prefix
            build/hamlib-src
          key: aurora-hamlib-4.7.2-windows-2022-v2
      - name: Build Hamlib
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-hamlib-windows.sh 4.7.2 "$(pwd)/build/hamlib-prefix"
          mv hamlib-src build/hamlib-src
      - name: Save Hamlib cache
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/hamlib-prefix
            build/hamlib-src
          key: aurora-hamlib-4.7.2-windows-2022-v2
      - name: Restore compiled application
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/windows-build
            build/wsjtx-jtty-source
          key: aurora-windows-app-v1-${{ hashFiles('scripts/prepare*.py', 'scripts/customize-jtty-ui.py', 'scripts/deepen-jtty-debug.py', 'scripts/add-jtty-snr.py', 'scripts/brand-aurora-jtty.py', 'scripts/limit-jtty-fallback.py', 'scripts/build-windows-jtty.sh', 'native/qt-ui/**', 'native/qt-audio/*.hpp', 'native/Assets/Aurora-JTTY.ico') }}
      - name: Build Aurora JTTY
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-windows-jtty.sh
      - name: Save compiled application
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/windows-build
            build/wsjtx-jtty-source
          key: ${{ steps.app-cache.outputs.cache-primary-key }}
      - name: Stage runtime and notices
        run: python scripts/package-windows-jtty.py
      - name: Verify packaged startup
        shell: pwsh
        run: ./scripts/test-windows-startup.ps1
      - name: Create Windows installer
        run: makensis scripts/windows-installer.nsi
      - name: Verify installed application
        shell: pwsh
        run: |
          $installer = Start-Process (Resolve-Path 'build/windows-output/Aurora-JTTY-1.3-windows-x64-setup.exe') -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer exited with code $($installer.ExitCode)" }
          ./scripts/test-windows-startup.ps1 -ExecutablePath "$env:LOCALAPPDATA/Programs/Aurora JTTY/bin/Aurora-JTTY.exe"
      - name: Create portable archive and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows-package/* -DestinationPath build/windows-output/Aurora-JTTY-1.3-windows-x64-portable.zip
          Get-ChildItem build/windows-output -File -Recurse | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content build/windows-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-JTTY-1.3-windows-x64
          path: build/windows-output/*
          retention-days: 30
      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            launch.out
            launch.png
            build/windows-build/CMakeFiles/CMakeConfigureLog.yaml
